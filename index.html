<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22bdtw-g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%2264%22%20y2%3D%2264%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ec4899%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%238b5cf6%22%2F%3E%3C%2FlinearGradient%3E%3Cmask%20id%3D%22bdtw-m%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%229%22%20cy%3D%2232%22%20r%3D%225.5%22%20fill%3D%22%23000%22%2F%3E%3Ccircle%20cx%3D%2255%22%20cy%3D%2232%22%20r%3D%225.5%22%20fill%3D%22%23000%22%2F%3E%3Cpath%20d%3D%22M32.00%2023.00L34.35%2029.36L41.13%2029.63L35.80%2033.84L37.64%2040.37L32.00%2036.60L26.36%2040.37L28.20%2033.84L22.87%2029.63L29.65%2029.36Z%22%20fill%3D%22%23000%22%2F%3E%3C%2Fmask%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22url(%23bdtw-g)%22%2F%3E%3Cg%20transform%3D%22translate(32%2032)%20scale(1)%20translate(-32%20-32)%22%3E%3Crect%20x%3D%229%22%20y%3D%2218%22%20width%3D%2246%22%20height%3D%2228%22%20rx%3D%224.5%22%20fill%3D%22%23fff%22%20mask%3D%22url(%23bdtw-m)%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" />
    <!-- viewport-fit=cover：瀏海機才吃得到 env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- 加到主畫面之後就沒有網址列，開起來跟 App 一樣 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="邦邦圖鑑" />
    <!-- 只留一條，由 JS 跟著實際主題更新（見下方 script 與 App 的 toggleDark）。
         用 media query 分兩條的話，使用者在站上切夜場模式時瀏覽器外框不會跟著變，
         iOS 加到主畫面之後那條色差就是狀態列，很明顯 -->
    <meta name="theme-color" content="#fdfaff" />
    <meta name="description" content="邦邦聲優與樂團來台的活動紀錄——LIVE、見面會、快閃店、上映會，從 2018 記到現在。粉絲整理，非官方。" />
    <meta property="og:title" content="邦邦來台圖鑑 Taiwan BanG Dream! Event Collection" />
    <meta property="og:description" content="2018–2026 年間 BanG Dream! 相關聲優、樂團、LIVE、FMT、快閃店、簽名會、上映會等來台活動。" />
    <meta property="og:type" content="website" />
    <!-- og:url / og:image / twitter:image 由 scripts/build-og.mjs 依實際網域注入。
         寫死在這裡會蓋掉自動偵測，分享出去的縮圖就會指向不存在的網域 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="邦邦來台圖鑑 Taiwan BanG Dream! Event Collection" />
    <meta name="twitter:description" content="2018–2026 年間 BanG Dream! 相關聲優、樂團、LIVE、FMT、快閃店、簽名會、上映會等來台活動。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 字型的 <link> 不寫在這裡：由 App 在第一個畫面畫出來之後才掛上去（src/utils/webfonts.js）。
         直接掛 stylesheet 的話，200 KB 的字型 CSS 加 1.2 MB 字型檔全都會擋在首屏前面，
         慢速 4G 下 FCP 十秒起跳。這兩條 preconnect 留著，等要載的時候連線已經接好 -->
    <!-- Google Search Console 的所有權驗證。刪掉會讓資源失去驗證，之後就看不到收錄狀況 -->
    <meta name="google-site-verification" content="qvWSHhzF_ugTmcsJmDcK0q0Cy3l1FF87npY5icrwkjI" />

    <title>邦邦來台圖鑑 · Taiwan BanG Dream! Event Collection</title>
    <script>
      (function () {
        // 淺色是主主題；深色（夜場模式）只在使用者明確選過時開啟
        try {
          if (localStorage.getItem('bdtw-theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name=theme-color]').content = '#07071a';
          }
        } catch (e) { /* 預設淺色 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
