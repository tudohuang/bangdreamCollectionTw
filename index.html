<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ec4899'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M12 9v10.5a3 3 0 1 1-2-2.8V9z' fill='%23fff'/%3E%3Ccircle cx='22' cy='10' r='2.2' fill='%23fff'/%3E%3C/svg%3E" />
    <!-- viewport-fit=cover：瀏海機才吃得到 env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- 加到主畫面之後就沒有網址列，開起來跟 App 一樣 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="邦邦圖鑑" />
    <!-- 只留一條，由 JS 跟著實際主題更新（見下方 script 與 App 的 toggleDark）。
         用 media query 分兩條的話，使用者在站上切夜場模式時瀏覽器外框不會跟著變，
         iOS 加到主畫面之後那條色差就是狀態列，很明顯 -->
    <meta name="theme-color" content="#fdfaff" />
    <meta name="description" content="邦邦聲優與樂團來台的活動紀錄——LIVE、見面會、快閃店、上映會，從 2018 記到現在。粉絲整理，非官方。" />
    <meta property="og:title" content="邦邦來台圖鑑 Taiwan BanG Dream! Event Collection" />
    <meta property="og:description" content="2018–2026 年間 BanG Dream! 相關聲優、樂團、LIVE、FMT、快閃店、簽名會、上映會等來台活動。" />
    <meta property="og:type" content="website" />
    <!-- og:url / og:image / twitter:image 由 scripts/build-og.mjs 依實際網域注入。
         寫死在這裡會蓋掉自動偵測，分享出去的縮圖就會指向不存在的網域 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="邦邦來台圖鑑 Taiwan BanG Dream! Event Collection" />
    <meta name="twitter:description" content="2018–2026 年間 BanG Dream! 相關聲優、樂團、LIVE、FMT、快閃店、簽名會、上映會等來台活動。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@500;600;700;800&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet" />
    <!-- Google Search Console 的所有權驗證。刪掉會讓資源失去驗證，之後就看不到收錄狀況 -->
    <meta name="google-site-verification" content="qvWSHhzF_ugTmcsJmDcK0q0Cy3l1FF87npY5icrwkjI" />

    <title>邦邦來台圖鑑 · Taiwan BanG Dream! Event Collection</title>
    <script>
      (function () {
        // 淺色是主主題；深色（夜場模式）只在使用者明確選過時開啟
        try {
          if (localStorage.getItem('bdtw-theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name=theme-color]').content = '#07071a';
          }
        } catch (e) { /* 預設淺色 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
